name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 静的サイト本体（index.html + data/）をそのまま配信
          # gas/, knowledge/, CLAUDE*.md などの非公開素材は除外
          path: .
          # NOTE: upload-pages-artifact@v3 は .git, node_modules 等を自動除外する

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
